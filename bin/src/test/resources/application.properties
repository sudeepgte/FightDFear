spring.datasource.url=jdbc:h2:mem:womensafety_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
jwt.secret=test-jwt-secret-key-at-least-32-characters-long
sms.enabled=false
razorpay.key.id=
razorpay.key.secret=
google.maps.apiKey=
MAIL_USERNAME=
MAIL_PASSWORD=
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=

app.base-url=http://localhost:8084

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
