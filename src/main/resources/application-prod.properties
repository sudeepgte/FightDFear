# Production profile — activate with: spring.profiles.active=prod
# All secrets MUST be supplied via environment variables (no inline defaults).

# --- Database (Flyway owns schema; Hibernate must not mutate) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP pool (production defaults)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=FightDFearHikariPool

# --- Logging (no SQL/parameter trace in production) ---
logging.level.root=INFO
logging.level.in.sp.main=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# --- Payments (real Razorpay required; mock disabled) ---
app.payments.mock-enabled=${PAYMENT_MOCK:false}

# --- Secrets (required via env) ---
jwt.secret=${JWT_SECRET}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}
google.maps.apiKey=${GOOGLE_MAPS_API_KEY}

# --- Public app URL ---
app.base-url=${APP_BASE_URL}

# --- Actuator (minimal exposure for load-balancer health checks) ---
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false

info.app.name=${spring.application.name}
info.app.profile=prod

# --- Graceful shutdown ---
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
