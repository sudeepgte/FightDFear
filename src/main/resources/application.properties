spring.application.name=women Safety


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/womenbesafe?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Keep update while migrating legacy schema; Flyway owns forward changes (loan_applications, etc.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway — baselines existing DBs created via Hibernate; new DDL goes in db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
# Note: spring.flyway.repair-on-migrate is NOT a Spring Boot property (ignored).
# Checksum repair is handled by FlywayRepairConfig (repair then migrate).

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG


server.port=8084

# Public app URL for links in emails/SMS (override per environment via APP_BASE_URL)
app.base-url=${APP_BASE_URL:http://localhost:8084}

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

#server.servlet.session.timeout=60m

